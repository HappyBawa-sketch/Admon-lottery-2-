<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center">

    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-red-600">YouTube Downloader</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="mb-4">
                    {% for message in messages %}
                        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
                            <span class="block sm:inline">{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="/download" method="POST" id="download-form" class="space-y-4">
            <div>
                <label for="url" class="block text-sm font-medium text-gray-700">Video URL</label>
                <input type="text" name="url" id="url" placeholder="Paste YouTube link here" required
                    class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500">
            </div>

            <button type="submit" id="submit-btn"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                Download Video
            </button>
        </form>

        <div id="loading" class="hidden flex-col items-center mt-4">
            <div class="loader"></div>
            <p class="mt-2 text-sm text-gray-600">Processing... please wait.</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('download-form');
        const loading = document.getElementById('loading');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', function() {
            loading.classList.remove('hidden');
            loading.classList.add('flex');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
        });

        // Note: Since the download happens via form submission which reloads/navigates (or downloads file),
        // the page state might reset or stay depending on browser behavior with Content-Disposition attachment.
        // If it's an attachment, the page stays. We can add a timeout to reset the button if needed,
        // but it's hard to know exactly when download starts.
        // A simple timeout to re-enable button after a few seconds might be good UX in case of error not caught by simple nav.

        // Re-enable button after a delay to allow downloading another video
        // Since we can't easily detect when the download starts without more complex logic/cookies,
        // we'll just assume it started or failed after a short while.
        setTimeout(() => {
            loading.classList.remove('flex');
            loading.classList.add('hidden');
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }, 5000);

        // However, if the server returns a redirect (error), the page *will* reload and spinner will be gone.
    </script>
</body>
</html>
